<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>テトリス</title>
<style>
  body {
    background: #3a3d4a;
    color: #f5f5f5;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
    padding: 20px;
  }
  h1 { margin: 0 0 10px; }
  #game-area {
    display: flex;
    gap: 20px;
  }
  canvas {
    background: #1e2130;
    border: 2px solid #8890a8;
  }
  #next {
    background: #1e2130;
    border: 2px solid #8890a8;
  }
  #info {
    font-size: 18px;
    line-height: 1.8;
  }
  #next-label {
    margin-top: 10px;
    font-size: 16px;
  }
  #message {
    font-size: 28px;
    color: #ff6b6b;
    font-weight: bold;
    min-height: 40px;
  }
  #restart {
    margin-top: 10px;
    padding: 8px 16px;
    font-size: 16px;
    cursor: pointer;
    display: none;
  }
</style>
</head>
<body>
<h1>テトリス</h1>
<div id="game-area">
  <canvas id="board" width="240" height="480"></canvas>
  <div id="info">
    <div>スコア: <span id="score">0</span></div>
    <div>ライン: <span id="lines">0</span></div>
    <div id="next-label">次のブロック</div>
    <canvas id="next" width="100" height="100"></canvas>
    <div id="message"></div>
    <button id="restart">もう一度プレイ</button>
    <div style="margin-top:20px; font-size:14px; color:#cfd2e0;">
      ← → : 移動<br>
      ↑ : 回転<br>
      ↓ : 落下を速める
    </div>
  </div>
</div>

<script>
const COLS = 12;
const ROWS = 24;
const BLOCK = 20;

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const nextCanvas = document.getElementById('next');
const nextCtx = nextCanvas.getContext('2d');
const scoreEl = document.getElementById('score');
const linesEl = document.getElementById('lines');
const messageEl = document.getElementById('message');
const restartBtn = document.getElementById('restart');

const COLORS = {
  I: '#4ce8f0',
  J: '#5c7cfa',
  L: '#ffb45c',
  O: '#fff066',
  S: '#69e26b',
  T: '#c77dff',
  Z: '#ff6b6b'
};

const SHAPES = {
  I: [[1,1,1,1]],
  J: [[1,0,0],[1,1,1]],
  L: [[0,0,1],[1,1,1]],
  O: [[1,1],[1,1]],
  S: [[0,1,1],[1,1,0]],
  T: [[0,1,0],[1,1,1]],
  Z: [[1,1,0],[0,1,1]]
};

let board, current, nextPiece, score, lines, dropInterval, dropTimer, gameOver;

function createBoard() {
  return Array.from({length: ROWS}, () => Array(COLS).fill(null));
}

function randomPiece() {
  const keys = Object.keys(SHAPES);
  const type = keys[Math.floor(Math.random() * keys.length)];
  const shape = SHAPES[type].map(row => row.slice());
  return {
    type,
    shape,
    color: COLORS[type],
    row: 0,
    col: Math.floor((COLS - shape[0].length) / 2)
  };
}

function rotateMatrix(matrix) {
  const rows = matrix.length;
  const cols = matrix[0].length;
  const result = Array.from({length: cols}, () => Array(rows).fill(0));
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      result[c][rows - 1 - r] = matrix[r][c];
    }
  }
  return result;
}

function collides(shape, row, col) {
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (!shape[r][c]) continue;
      const br = row + r;
      const bc = col + c;
      if (bc < 0 || bc >= COLS || br >= ROWS) return true;
      if (br >= 0 && board[br][bc]) return true;
    }
  }
  return false;
}

function mergePiece() {
  const { shape, row, col, color } = current;
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (!shape[r][c]) continue;
      const br = row + r;
      const bc = col + c;
      if (br >= 0) board[br][bc] = color;
    }
  }
}

function clearLines() {
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (board[r].every(cell => cell)) {
      board.splice(r, 1);
      board.unshift(Array(COLS).fill(null));
      cleared++;
      r++;
    }
  }
  if (cleared > 0) {
    const points = [0, 100, 300, 500, 800];
    score += points[cleared] || cleared * 200;
    lines += cleared;
    scoreEl.textContent = score;
    linesEl.textContent = lines;
  }
}

function spawnPiece() {
  current = nextPiece || randomPiece();
  nextPiece = randomPiece();
  drawNext();
  if (collides(current.shape, current.row, current.col)) {
    endGame();
  }
}

function endGame() {
  gameOver = true;
  clearInterval(dropTimer);
  messageEl.textContent = 'ゲームオーバー';
  restartBtn.style.display = 'inline-block';
}

function drop() {
  if (gameOver) return;
  if (!collides(current.shape, current.row + 1, current.col)) {
    current.row++;
  } else {
    mergePiece();
    clearLines();
    spawnPiece();
  }
  draw();
}

function moveLeft() {
  if (gameOver) return;
  if (!collides(current.shape, current.row, current.col - 1)) {
    current.col--;
    draw();
  }
}

function moveRight() {
  if (gameOver) return;
  if (!collides(current.shape, current.row, current.col + 1)) {
    current.col++;
    draw();
  }
}

function rotate() {
  if (gameOver) return;
  const rotated = rotateMatrix(current.shape);
  let newCol = current.col;
  if (collides(rotated, current.row, current.col)) {
    if (!collides(rotated, current.row, current.col - 1)) {
      newCol = current.col - 1;
    } else if (!collides(rotated, current.row, current.col + 1)) {
      newCol = current.col + 1;
    } else {
      return;
    }
  }
  current.shape = rotated;
  current.col = newCol;
  draw();
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c]) {
        drawCell(c, r, board[r][c]);
      }
    }
  }

  const { shape, row, col, color } = current;
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (shape[r][c] && row + r >= 0) {
        drawCell(col + c, row + r, color);
      }
    }
  }
}

function drawCell(c, r, color) {
  ctx.fillStyle = color;
  ctx.fillRect(c * BLOCK, r * BLOCK, BLOCK, BLOCK);
  ctx.strokeStyle = '#3a3d4a';
  ctx.strokeRect(c * BLOCK, r * BLOCK, BLOCK, BLOCK);
}

function drawNext() {
  nextCtx.fillStyle = '#1e2130';
  nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
  if (!nextPiece) return;
  const { shape, color } = nextPiece;
  const size = 20;
  const offsetX = (nextCanvas.width - shape[0].length * size) / 2;
  const offsetY = (nextCanvas.height - shape.length * size) / 2;
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (!shape[r][c]) continue;
      nextCtx.fillStyle = color;
      nextCtx.fillRect(offsetX + c * size, offsetY + r * size, size, size);
      nextCtx.strokeStyle = '#3a3d4a';
      nextCtx.strokeRect(offsetX + c * size, offsetY + r * size, size, size);
    }
  }
}

function startGame() {
  board = createBoard();
  score = 0;
  lines = 0;
  gameOver = false;
  nextPiece = null;
  scoreEl.textContent = score;
  linesEl.textContent = lines;
  messageEl.textContent = '';
  restartBtn.style.display = 'none';
  spawnPiece();
  clearInterval(dropTimer);
  dropInterval = 1000;
  dropTimer = setInterval(drop, dropInterval);
  draw();
}

document.addEventListener('keydown', (e) => {
  switch (e.key) {
    case 'ArrowLeft':
      e.preventDefault();
      moveLeft();
      break;
    case 'ArrowRight':
      e.preventDefault();
      moveRight();
      break;
    case 'ArrowUp':
      e.preventDefault();
      rotate();
      break;
    case 'ArrowDown':
      e.preventDefault();
      drop();
      break;
  }
});

restartBtn.addEventListener('click', startGame);

startGame();
</script>
</body>
</html>
